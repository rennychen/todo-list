spring:
  datasource:
    url: jdbc:mysql://localhost:3306/todo_list_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
      redis:
        host: localhost
        port: 6379
        timeout: 2000ms
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: 604800000
  issuer: my-app
  header: Authorization
  prefix: Bearer
  audience: my-users
logging:
  file:
    name: logs/app.log
  level:
    root: WARN
    com.github.renny.todolist: DEBUG